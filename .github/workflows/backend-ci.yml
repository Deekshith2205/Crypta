name: Backend CI

on:
  push:
    branches:
      - main
      - janya
  pull_request:
    branches:
      - main
      - janya
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test-and-audit:
    name: Backend Test & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit

      - name: Run backend pytest suite
        run: pytest backend/tests -v

      - name: Run supply-chain security audit
        run: pip-audit -r backend/requirements.lock
